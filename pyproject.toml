[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangedong"
version = "0.1.0"
description = "A manga-to-anime CLI pipeline for importing black-and-white manga pages, colorizing them, animating them, and exporting MP4 videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio[ffmpeg]",
  "numpy",
  "pillow",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
mangedong = "mangedong.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
