<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mangedong · Task Board</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Mangedong</h1>
        <p class="subtitle">A tiny task board to prove the environment works end to end.</p>
      </header>

      <form id="task-form" class="task-form" autocomplete="off">
        <input
          id="task-input"
          class="task-input"
          type="text"
          placeholder="What needs doing?"
          aria-label="New task title"
          required
        />
        <button type="submit" class="btn-primary">Add task</button>
      </form>

      <section class="stats" aria-live="polite">
        <span id="count-total">0 tasks</span>
        <span id="count-done">0 done</span>
      </section>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>No tasks yet. Add one above.</p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
